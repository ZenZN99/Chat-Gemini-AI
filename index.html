<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="gemini.svg" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=content_copy"
    />
    <title>Chat Gemeni AI</title>
  </head>
  <body>
    <section>
      <div class="container">
        <div class="header">
          <h1>Chat Gemeni AI</h1>
          <h2>Welcome dear user</h2>
          <p>How can I help you today?</p>
        </div>

        <div class="chat-list"></div>

        <form class="typing-form">
          <div class="input-wrapper">
            <input
              type="text"
              class="typing-input"
              placeholder="Enter your question"
              required
            />
            <button type="submit">Send</button>
          </div>
        </form>
      </div>
    </section>
    <script src="main.js"></script>
  </body>
</html>
